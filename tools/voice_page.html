<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>음성 지시</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 480px; margin: 0 auto; padding: 16px; background: #111; color: #eee; }
  button { font-size: 18px; padding: 14px 20px; border-radius: 8px; border: none; margin: 6px 0; width: 100%; cursor: pointer; }
  #recordBtn { background: #e74c3c; color: white; }
  #recordBtn.recording { background: #27ae60; }
  #cleanBtn, #submitBtn { background: #2c3e50; color: white; }
  textarea { width: 100%; min-height: 120px; font-size: 16px; padding: 8px; border-radius: 8px; box-sizing: border-box; background: #222; color: #eee; border: 1px solid #444; }
  #status { color: #999; font-size: 14px; margin: 8px 0; min-height: 20px; }
  #result { color: #2ecc71; font-weight: bold; }
  input[type=password] { width: 100%; font-size: 16px; padding: 8px; box-sizing: border-box; }
</style>
</head>
<body>
  <div id="passGate">
    <h3>비밀번호</h3>
    <input type="password" id="passInput">
    <button onclick="savePassword()">입장</button>
  </div>
  <div id="main" style="display:none">
    <h3>음성 지시</h3>
    <button id="recordBtn" onclick="toggleRecord()">🎤 녹음 시작</button>
    <div id="status"></div>
    <textarea id="transcript" placeholder="말한 내용이 여기 표시됩니다"></textarea>
    <button id="cleanBtn" onclick="cleanUp()">🧹 정리하기 (Haiku)</button>
    <textarea id="cleaned" placeholder="정리된 지시문 (수정 가능)" style="display:none"></textarea>
    <button id="submitBtn" onclick="submitTask()" style="display:none">🚀 제출</button>
    <div id="result"></div>
  </div>

<script>
let recognition = null;
let recording = false;

function savePassword() {
  const p = document.getElementById('passInput').value;
  if (!p) return;
  localStorage.setItem('voicePassword', p);
  enterMain();
}

function enterMain() {
  document.getElementById('passGate').style.display = 'none';
  document.getElementById('main').style.display = 'block';
}

window.onload = () => {
  if (localStorage.getItem('voicePassword')) enterMain();
};

function toggleRecord() {
  if (!recording) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert('이 브라우저는 음성인식을 지원하지 않아요'); return; }
    recognition = new SR();
    recognition.lang = 'ko-KR';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.onresult = (e) => {
      let text = '';
      for (let i = 0; i < e.results.length; i++) text += e.results[i][0].transcript;
      document.getElementById('transcript').value = text;
    };
    recognition.onerror = (e) => { document.getElementById('status').textContent = '오류: ' + e.error; };
    recognition.onend = () => {
      if (recording) recognition.start(); // 폰 브라우저가 몇십 초마다 끊는 경우 자동 재시작
    };
    recognition.start();
    recording = true;
    document.getElementById('recordBtn').textContent = '⏹ 녹음 중지';
    document.getElementById('recordBtn').classList.add('recording');
    document.getElementById('status').textContent = '듣는 중...';
  } else {
    recording = false; // onend 재시작 로직보다 먼저 꺼야 함
    recognition.stop();
    document.getElementById('recordBtn').textContent = '🎤 녹음 시작';
    document.getElementById('recordBtn').classList.remove('recording');
    document.getElementById('status').textContent = '';
  }
}

async function cleanUp() {
  const transcript = document.getElementById('transcript').value.trim();
  if (!transcript) { alert('먼저 말해주세요'); return; }
  document.getElementById('status').textContent = '정리 중...';
  document.getElementById('result').textContent = '';
  try {
    const res = await fetch('/api/clean', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Voice-Password': localStorage.getItem('voicePassword') },
      body: JSON.stringify({ transcript }),
    });
    const data = await res.json();
    document.getElementById('status').textContent = '';
    if (data.error) { alert('오류: ' + data.error); return; }
    document.getElementById('cleaned').style.display = 'block';
    document.getElementById('cleaned').value = data.cleaned;
    document.getElementById('submitBtn').style.display = 'block';
  } catch (e) {
    document.getElementById('status').textContent = '요청 실패: ' + e;
  }
}

async function submitTask() {
  const text = document.getElementById('cleaned').value.trim();
  if (!text) return;
  document.getElementById('status').textContent = '제출 중...';
  try {
    const res = await fetch('/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Voice-Password': localStorage.getItem('voicePassword') },
      body: JSON.stringify({ text }),
    });
    const data = await res.json();
    document.getElementById('status').textContent = '';
    if (data.error) { alert('오류: ' + data.error); return; }
    document.getElementById('result').textContent = '✅ 큐에 제출됨';
    document.getElementById('transcript').value = '';
    document.getElementById('cleaned').value = '';
    document.getElementById('cleaned').style.display = 'none';
    document.getElementById('submitBtn').style.display = 'none';
  } catch (e) {
    document.getElementById('status').textContent = '요청 실패: ' + e;
  }
}
</script>
</body>
</html>
